apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  DB_HOST: "mysql-service"
  DB_NAME: "crud_db"
  DB_PORT: "3306"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  DB_USER: "cruduser"
  DB_PASSWORD: "crudpassword"
  MYSQL_ROOT_PASSWORD: "rootpassword"
  MYSQL_DATABASE: "crud_db"